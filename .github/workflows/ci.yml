name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rpushd

jobs:
  validate:
    name: Validate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run cargo check
        run: cargo check --locked

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-audit@0.23.0
          fallback: none

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  release-assets:
    name: Build Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [validate, audit]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64-gnu
          - target: x86_64-unknown-linux-musl
            archive_suffix: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            archive_suffix: linux-aarch64-gnu
          - target: aarch64-unknown-linux-musl
            archive_suffix: linux-aarch64-musl

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cross
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cross@0.2.5
          fallback: none

      - name: Build release binary
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package release asset
        run: |
          mkdir -p dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}/
          cp README.md nginx-location.conf rpushd.service dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}/
          tar -C dist -czf dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz ${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}
          (
            cd dist
            sha256sum ${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz > ${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz.sha256
          )

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz
            dist/${{ env.BINARY_NAME }}-${{ matrix.archive_suffix }}.tar.gz.sha256
